name: LogSpindle Rust validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: logspindle-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run full locked source verification on one build worker
        run: bash scripts/verify.sh
